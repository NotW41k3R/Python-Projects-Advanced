{% extends 'base.html'%}
{% block title %} Library {% endblock %}

{% block content %}
	<div class="container mt-5"> 
        <h1>My Library</h1>
        <ul class="list-group">
            {% for book in books %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ book.title }} - {{ book.author }} - {{ book.rating }}/10</span>

                <span>
                    <a href="{{ url_for('edit', book_id=book.id) }}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="{{ url_for('delete', book_id=book.id) }}" class="btn btn-sm btn-danger">Delete</a>
                </span>
            </li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('add') }}" class="btn btn-success mt-4">Add New Book</a>
    </div>

{% endblock %}
